<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44"
     role="img" aria-label="RespirAburrá">
  <title>RespirAburrá</title>
  <!-- Las dos laderas del Valle de Aburrá; las barras son las capas de aire
       que quedan atrapadas en el valle. Se lee también como la M de montaña. -->
  <path d="M3 37 L15.5 9 L22 22.5 L28.5 7 L41 37" fill="none" stroke="#E9EEF0"
        stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#3FAEC9">
    <rect x="9"  y="24.5" width="26" height="3" rx="1.5"/>
    <rect x="13" y="30"   width="18" height="3" rx="1.5" opacity=".85"/>
    <rect x="17" y="35.5" width="10" height="3" rx="1.5" opacity=".72"/>
  </g>
</svg>
